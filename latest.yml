changelog:
  - "[11.2.2]"
    - **Mapping sync fix**: One broken provider table returning HTTP 500 no longer aborts the whole mapping sync — core tables (anime/manga) now sync even when a provider table fails
    - **Faster startup**: Auto-update check deferred 8s; image-cache cleanup batches deletes; snapshot apply removes 80k+ per-row queries
    - **repo enable/disable**: Toggle extension repositories on/off; disabled repos hide but installed items remain
    - **Discover provider switcher**: Provider picker left of Anime/Manga toggle; clears caches, reloads page 1
    - **Description copy button**: Copy full raw text (strips `[more]`)
    - **Plex & Jellyfin section**: Dedicated settings before Subtitle Customization & Appearance
    - **Info page seasons**: Now includes OVA, MOVIE, and SPECIAL formats (not just TV series)
    - **Changelog merge**: Merged upstream [11.2.1] entries ([manga reader overhaul](https://github.com/TheYogMehta/StrawVerse/releases/tag/v11.2.1), [mapping/Manga schema fixes](https://github.com/TheYogMehta/StrawVerse/releases/tag/v11.2.0))
    - **Fixed Android bugs**: Browse button dead (missing `Swal` import), provider picker hidden (gate relaxed `> 1` → `>= 1`)
    - **Version continues as 11.2.2** above upstream's 11.2.1
