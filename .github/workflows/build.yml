name: Build & Release

# Builds Linux artifacts on every push, and publishes a unified GitHub Release
# when a version tag (v*) is pushed.
#
# Linux -> strawverse-<version>.AppImage, .deb   (+ best-effort .snap)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Allow AppImage tooling to run without FUSE in CI.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  build-linux:
    name: Linux (AppImage + deb, best-effort snap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gui/package-lock.json
            electron/package-lock.json

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          # squashfs-tools: mksquashfs for AppImage; libfuse2: appimage runtime;
          # fpm: electron-builder's .deb packer (pure-ruby gem).
          sudo apt-get install -y libfuse2 squashfs-tools rpm ruby ruby-dev build-essential
          sudo gem install fpm --no-document

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build GUI (vite)
        working-directory: gui
        run: npm run build

      - name: Install Electron deps + bundled binaries
        working-directory: electron
        run: npm ci

      - name: Build AppImage + deb
        working-directory: electron
        run: npx electron-builder --linux AppImage deb --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: StrawVerse-Linux-AppImage
          path: electron/dist/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: StrawVerse-Linux-deb
          path: electron/dist/*.deb
          if-no-files-found: error

      # snapcraft is heavier and occasionally flaky in CI, so it never blocks
      # the AppImage/deb artifacts above.
      - name: Build snap (best-effort)
        continue-on-error: true
        working-directory: electron
        run: |
          sudo snap install snapcraft --classic
          npx electron-builder --linux snap --publish never

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StrawVerse-Linux-snap
          path: electron/dist/*.snap
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
