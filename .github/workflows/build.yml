name: Build & Release

# Builds Desktop (Windows + Linux) and Android artifacts on every push,
# and publishes a unified GitHub Release when a version tag (v*) is pushed.
#
# Windows  -> StrawVerse.Setup.<version>.exe        (NSIS installer)
# Linux    -> strawverse-<version>.AppImage, .deb   (+ best-effort .snap)
# Android  -> app-release.apk                        (release build, debug-signed
#                                                    unless a keystore is provided)
#
# Android release signing is driven by these repo Secrets (all optional — if the
# keystore secret is absent the APK is debug-signed so CI never breaks):
#   STRAWVERSE_KEYSTORE_BASE64   base64 of the .keystore / .jks file
#   STRAWVERSE_KEYSTORE_PASSWORD keystore password
#   STRAWVERSE_KEY_ALIAS         key alias (defaults to "strawverse")
#   STRAWVERSE_KEY_PASSWORD      key password (defaults to keystore password)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Allow AppImage tooling to run without FUSE in CI.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  build-windows:
    name: Windows (NSIS installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gui/package-lock.json
            electron/package-lock.json

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build GUI (vite)
        working-directory: gui
        run: npm run build

      - name: Install Electron deps + bundled binaries
        working-directory: electron
        run: npm ci

      - name: Build Windows installer
        working-directory: electron
        run: npx electron-builder --win nsis

      - uses: actions/upload-artifact@v4
        with:
          name: StrawVerse-Windows-Setup
          path: electron/dist/StrawVerse.Setup.*.exe
          if-no-files-found: error

  build-linux:
    name: Linux (AppImage + deb, best-effort snap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gui/package-lock.json
            electron/package-lock.json

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          # squashfs-tools: mksquashfs for AppImage; libfuse2: appimage runtime;
          # fpm: electron-builder's .deb packer (pure-ruby gem).
          sudo apt-get install -y libfuse2 squashfs-tools rpm ruby ruby-dev build-essential
          sudo gem install fpm --no-document

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build GUI (vite)
        working-directory: gui
        run: npm run build

      - name: Install Electron deps + bundled binaries
        working-directory: electron
        run: npm ci

      - name: Build AppImage + deb
        working-directory: electron
        run: npx electron-builder --linux AppImage deb

      - uses: actions/upload-artifact@v4
        with:
          name: StrawVerse-Linux-AppImage
          path: electron/dist/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: StrawVerse-Linux-deb
          path: electron/dist/*.deb
          if-no-files-found: error

      # snapcraft is heavier and occasionally flaky in CI, so it never blocks
      # the AppImage/deb artifacts above.
      - name: Build snap (best-effort)
        continue-on-error: true
        working-directory: electron
        run: |
          sudo snap install snapcraft --classic
          npx electron-builder --linux snap

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StrawVerse-Linux-snap
          path: electron/dist/*.snap
          if-no-files-found: ignore

  build-android:
    name: Android (release APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gui/package-lock.json
            capacitor/package-lock.json
            electron/package-lock.json

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;28.0.13004108"

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Install Capacitor deps
        working-directory: capacitor
        run: npm ci

      # Backend deps for esbuild resolution (NODE_PATH). --ignore-scripts skips
      # the desktop binary download, which Android does not use.
      - name: Install Electron deps (no binaries)
        working-directory: electron
        run: npm ci --ignore-scripts

      - name: Decode release keystore
        if: ${{ secrets.STRAWVERSE_KEYSTORE_BASE64 != '' }}
        env:
          KS_B64: ${{ secrets.STRAWVERSE_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "STRAWVERSE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "STRAWVERSE_KEYSTORE_PASSWORD=${{ secrets.STRAWVERSE_KEYSTORE_PASSWORD }}"
            echo "STRAWVERSE_KEY_ALIAS=${{ secrets.STRAWVERSE_KEY_ALIAS }}"
            echo "STRAWVERSE_KEY_PASSWORD=${{ secrets.STRAWVERSE_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Sync backend + build APK
        working-directory: capacitor
        run: |
          npm run sync:android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: StrawVerse-Android-APK
          path: capacitor/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
