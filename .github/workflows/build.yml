name: Build & Release

# Builds Desktop (Windows + Linux) and Android artifacts on every push,
# and publishes a unified GitHub Release when a version tag (v*) is pushed.
#
# Windows  -> StrawVerse.Setup.<version>.exe        (NSIS installer)
# Linux    -> strawverse-<version>.AppImage, .deb   (+ best-effort .snap)
# Android  -> app-release.apk                        (release build, debug-signed —
#              gradle falls back to the debug key when no keystore is configured)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Allow AppImage tooling to run without FUSE in CI.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  build-windows:
    name: Windows (NSIS installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gui/package-lock.json
            electron/package-lock.json

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build GUI (vite)
        working-directory: gui
        run: npm run build

      - name: Install Electron deps + bundled binaries
        working-directory: electron
        run: npm ci

      # --publish never: package.json declares a GitHub `publish` config, and CI
      # would otherwise try to upload to it and fail without a GH_TOKEN. Our own
      # release job uses softprops/action-gh-release instead.
      - name: Build Windows installer
        working-directory: electron
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: StrawVerse-Windows-Setup
          path: electron/dist/StrawVerse.Setup.*.exe
          if-no-files-found: error

  build-linux:
    name: Linux (AppImage + deb, best-effort snap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gui/package-lock.json
            electron/package-lock.json

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          # squashfs-tools: mksquashfs for AppImage; libfuse2: appimage runtime;
          # fpm: electron-builder's .deb packer (pure-ruby gem).
          sudo apt-get install -y libfuse2 squashfs-tools rpm ruby ruby-dev build-essential
          sudo gem install fpm --no-document

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build GUI (vite)
        working-directory: gui
        run: npm run build

      - name: Install Electron deps + bundled binaries
        working-directory: electron
        run: npm ci

      - name: Build AppImage + deb
        working-directory: electron
        run: npx electron-builder --linux AppImage deb --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: StrawVerse-Linux-AppImage
          path: electron/dist/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: StrawVerse-Linux-deb
          path: electron/dist/*.deb
          if-no-files-found: error

      # snapcraft is heavier and occasionally flaky in CI, so it never blocks
      # the AppImage/deb artifacts above.
      - name: Build snap (best-effort)
        continue-on-error: true
        working-directory: electron
        run: |
          sudo snap install snapcraft --classic
          npx electron-builder --linux snap --publish never

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StrawVerse-Linux-snap
          path: electron/dist/*.snap
          if-no-files-found: ignore

  build-android:
    name: Android (release APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gui/package-lock.json
            capacitor/package-lock.json
            electron/package-lock.json

      # Override `packages` — the default includes the deprecated "tools" package,
      # which modern sdkmanager rejects ("Failed to find package 'tools'"). The
      # action still provisions cmdline-tools and accepts licenses; we just point
      # it at the exact SDK pieces this app needs (compileSdk 34, NDK 28).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;28.0.13004108'

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Install Capacitor deps
        working-directory: capacitor
        run: npm ci

      # Backend deps for esbuild resolution (NODE_PATH). --ignore-scripts skips
      # the desktop binary download, which Android does not use.
      - name: Install Electron deps (no binaries)
        working-directory: electron
        run: npm ci --ignore-scripts

      - name: Sync backend + build APK
        working-directory: capacitor
        run: |
          npm run sync:android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: StrawVerse-Android-APK
          path: capacitor/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
